<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KH CHEM</title>
<style>
:root{--bg:#f7fafc;--card:#fff;--ink:#253043;--muted:#8290a3;--line:#e7edf3;--blue:#8fc8e8;--blue2:#eaf6fc;--deep:#4d91bb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink)}
button,input,select{font:inherit}.app{max-width:760px;margin:auto;padding:18px 16px 95px}.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{font-size:24px;font-weight:900;letter-spacing:-1px}.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.2px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 5px 18px #4561a00a}.hero{text-align:center}.monster{font-size:68px;margin:8px 0}.hero-img{width:132px;height:132px;object-fit:contain;display:block;margin:6px auto}.name{font-size:22px;font-weight:900}.muted{color:var(--muted);font-size:13px}.chips{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:12px 0}.chip{padding:7px 10px;border-radius:999px;background:var(--blue2);font-size:12px;font-weight:700}.bar{height:9px;border-radius:20px;background:#edf1f5;overflow:hidden;max-width:270px;margin:8px auto}.bar i{display:block;height:100%;width:25%;background:var(--blue)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:11px 6px;border-radius:15px;background:#f5f8fa;text-align:center}.stat b{display:block}.btn{border:0;border-radius:14px;min-height:44px;padding:10px 14px;background:var(--deep);color:white;font-weight:800}.btn.alt{background:var(--blue2);color:#3d7698}.btn.ghost{background:#f2f5f7;color:#566577}.btn.small{min-height:36px;padding:7px 10px;font-size:12px}.row{display:flex;gap:9px;align-items:center}.grow{flex:1}.input{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;background:white;min-height:45px}.title{font-weight:900;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.moncard{text-align:center;border:1px solid var(--line);background:white;border-radius:18px;padding:13px}.moncard .pic{font-size:45px}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding:8px}.tab{border:0;background:none;border-radius:13px;min-height:56px;color:var(--muted)}.tab.on{background:var(--blue2);color:#3d7698;font-weight:800}.tab span{display:block;font-size:20px}.page{display:none}.page.on{display:block}.teacher{display:none}.classrow,.studentrow{padding:12px 0;border-top:1px solid var(--line)}.classrow:first-child,.studentrow:first-child{border-top:0}.reward{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.modal{position:fixed;inset:0;background:#17202b55;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.on{display:flex}.modalbox{width:min(430px,100%);background:white;border-radius:24px;padding:20px}.notice{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#253043;color:#fff;border-radius:999px;padding:10px 15px;display:none;z-index:30;font-size:13px}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head><body>
<div id="notice" class="notice"></div>
<div class="app">
<header class="header"><div class="brand">KH CHEM<small>Chemistry Class</small></div><button id="teacherBtn" class="btn alt small">교사 모드</button></header>

<main id="student">
<section id="home" class="page on">
<div class="card hero"><div class="muted">대표 케미몬</div><img id="heroImage" class="hero-img" src="oxygenmon.png" alt="산소몬"><div id="heroPic" class="monster" style="display:none">🫧</div><div id="heroName" class="name">산소몬</div><div id="heroMeta" class="muted">O · Lv.2</div><div class="bar"><i id="growth"></i></div><div id="growthText" class="muted">성장 1 / 4</div>
<div class="chips"><span class="chip">🧑‍🔬 <span id="nickname">새싹연구원</span></span><span class="chip">🎫 <span id="tickets">3</span></span></div>
<div class="stats"><div class="stat"><span class="muted">연구원</span><b>Lv.8</b></div><div class="stat"><span class="muted">도감</span><b><span id="found">4</span>/12</b></div><div class="stat"><span class="muted">소속 반</span><b id="classShort">화학Ⅰ 1반</b></div></div>
<button id="editProfile" class="btn ghost small" style="margin-top:12px">닉네임 · 반 설정</button></div>
<div class="card"><div class="title">오늘의 활동</div><div class="row"><div style="font-size:28px">⚗️</div><div><b>화학 반응에서의 양적 관계</b><div class="muted">활동을 완료하고 보상을 받아보세요.</div></div></div></div>
</section>
<section id="draw" class="page"><div class="card hero"><div class="title">케미몬 뽑기</div><div id="drawPic" class="monster">🎁</div><div id="drawMsg" class="name">누구를 만나게 될까?</div><p class="muted">새 케미몬은 도감에 등록되고, 중복은 성장해요.</p><button id="drawBtn" class="btn">🎫 1장 사용</button></div></section>
<section id="dex" class="page"><div class="title">케미몬 도감</div><div id="dexGrid" class="grid"></div></section>
<section id="classroom" class="page"><div class="card"><div class="row"><div class="grow"><div class="title" id="classTitle">화학Ⅰ 1반</div><div class="muted">친구들의 대표 케미몬</div></div></div><div id="friends"></div></div></section>
</main>

<main id="teacher" class="teacher">
<div class="card"><div class="row"><div class="grow"><div class="title">교사 관리</div><div class="muted">반 개설 · 학생 · 보상 관리</div></div><button id="studentBtn" class="btn alt small">학생 화면</button></div></div>
<div class="card"><div class="row"><select id="classSelect" class="input grow"></select><button id="newClassBtn" class="btn small">+ 새 반</button></div><div id="classInfo" class="muted" style="margin-top:9px"></div></div>
<div class="card"><div class="title">일괄 보상</div><div class="reward"><button class="btn small" id="allTicket">선택 학생 🎫 +1</button><button class="btn alt small" id="allXp">선택 학생 XP +10</button></div></div>
<div class="card"><div class="title">학생 관리</div><div id="studentList"></div></div>
</main>
</div>

<nav id="tabs" class="tabs"><button class="tab on" data-p="home"><span>🏠</span>홈</button><button class="tab" data-p="draw"><span>🎁</span>케미몬</button><button class="tab" data-p="dex"><span>📖</span>도감</button><button class="tab" data-p="classroom"><span>👥</span>우리 반</button></nav>

<div id="profileModal" class="modal"><div class="modalbox"><div class="title">내 정보 설정</div><label class="muted">닉네임</label><input id="nicknameInput" class="input" maxlength="12" placeholder="사용할 이름"><div style="height:10px"></div><label class="muted">반 가입 코드</label><input id="codeInput" class="input" maxlength="8" placeholder="예: CHEM1"><div class="muted" style="margin-top:7px">선생님에게 받은 가입 코드를 입력하세요.</div><div class="row" style="margin-top:15px"><button id="closeProfile" class="btn ghost grow">취소</button><button id="saveProfile" class="btn grow">저장</button></div></div></div>
<div id="classModal" class="modal"><div class="modalbox"><div class="title">새 반 만들기</div><input id="classNameInput" class="input" placeholder="예: 화학Ⅰ 2반"><div style="height:10px"></div><input id="classCodeInput" class="input" placeholder="가입 코드 예: CHEM2" maxlength="8"><div class="row" style="margin-top:15px"><button id="closeClass" class="btn ghost grow">취소</button><button id="saveClass" class="btn grow">반 만들기</button></div></div></div>

<script>
const mons=[['H','수소몬','☁️'],['He','헬륨몬','🎈'],['C','탄소몬','💎'],['N','질소몬','🐑'],['O','산소몬','🫧'],['Ne','네온몬','🌌'],['Na','나트륨몬','🧊'],['Mg','마그네슘몬','🌱'],['Cl','염소몬','🟢'],['Fe','철몬','🛡️'],['Cu','구리몬','🦊'],['Au','골드몬','👑']].map(x=>({id:x[0],name:x[1],pic:x[2]}));
let state=JSON.parse(localStorage.getItem('khchem-v2')||'null')||{nickname:'새싹연구원',tickets:3,hero:'O',classId:1,owned:{H:{lv:1,c:0},C:{lv:1,c:0},O:{lv:2,c:1},Ne:{lv:1,c:0}},classes:[{id:1,name:'화학Ⅰ 1반',code:'CHEM1'},{id:2,name:'화학Ⅰ 2반',code:'CHEM2'}]};
const classmates=['민트','구름','몰리','코코','나나']; const $=s=>document.querySelector(s), get=id=>mons.find(m=>m.id===id), save=()=>localStorage.setItem('khchem-v2',JSON.stringify(state));
function note(s){let n=$('#notice');n.textContent=s;n.style.display='block';clearTimeout(note.t);note.t=setTimeout(()=>n.style.display='none',1600)}
function currentClass(){return state.classes.find(c=>c.id==state.classId)||state.classes[0]}
function render(){let h=get(state.hero),d=state.owned[state.hero],need=Math.min(d.lv+2,6),cl=currentClass();$('#heroPic').textContent=h.pic;$('#heroName').textContent=h.name;$('#heroMeta').textContent=h.id+' · Lv.'+d.lv;$('#growth').style.width=(d.c/need*100)+'%';$('#growthText').textContent='성장 '+d.c+' / '+need;$('#nickname').textContent=state.nickname;$('#tickets').textContent=state.tickets;$('#found').textContent=Object.keys(state.owned).length;$('#classShort').textContent=cl.name;$('#classTitle').textContent=cl.name;
$('#dexGrid').innerHTML='';mons.forEach(m=>{let d=state.owned[m.id],e=document.createElement('div');e.className='moncard';e.innerHTML=d?`<div class="pic">${m.pic}</div><b>${m.name}</b><div class="muted">${m.id} · Lv.${d.lv}</div><button class="btn alt small" style="margin-top:7px">${state.hero===m.id?'대표':'대표 설정'}</button>`:`<div class="pic">❔</div><b>미발견</b><div class="muted">${m.id}</div>`;if(d)e.querySelector('button').onclick=()=>{state.hero=m.id;save();render()};$('#dexGrid').appendChild(e)});
$('#friends').innerHTML='';classmates.forEach((n,i)=>{let m=mons[(i*2+4)%mons.length],e=document.createElement('div');e.className='studentrow row';e.innerHTML=`<div style="font-size:34px">${m.pic}</div><div class="grow"><b>${n}</b><div class="muted">${m.name} · Lv.${i+1}</div></div>`;$('#friends').appendChild(e)});renderTeacher()}
$('#drawBtn').onclick=()=>{if(state.tickets<1)return note('뽑기권이 없어요.');state.tickets--;let m=mons[Math.floor(Math.random()*mons.length)];$('#drawPic').textContent=m.pic;if(!state.owned[m.id]){state.owned[m.id]={lv:1,c:0};$('#drawMsg').textContent='NEW! '+m.name}else{let d=state.owned[m.id];d.c++;let need=Math.min(d.lv+2,6);if(d.c>=need){d.lv++;d.c=0;$('#drawMsg').textContent=m.name+' Lv.'+d.lv+'!'}else $('#drawMsg').textContent=m.name+' 성장 +1'}save();render()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));$('#'+b.dataset.p).classList.add('on')});
$('#editProfile').onclick=()=>{$('#nicknameInput').value=state.nickname;$('#codeInput').value='';$('#profileModal').classList.add('on')};$('#closeProfile').onclick=()=>$('#profileModal').classList.remove('on');$('#saveProfile').onclick=()=>{let nick=$('#nicknameInput').value.trim(),code=$('#codeInput').value.trim().toUpperCase();if(nick)state.nickname=nick;if(code){let c=state.classes.find(x=>x.code.toUpperCase()===code);if(!c)return note('가입 코드를 확인해 주세요.');state.classId=c.id}save();$('#profileModal').classList.remove('on');render();note('저장했어요!')};
$('#teacherBtn').onclick=()=>{$('#student').style.display='none';$('#teacher').style.display='block';$('#tabs').style.display='none'};$('#studentBtn').onclick=()=>{$('#student').style.display='block';$('#teacher').style.display='none';$('#tabs').style.display='grid'};
function renderTeacher(){let s=$('#classSelect');s.innerHTML='';state.classes.forEach(c=>{let o=document.createElement('option');o.value=c.id;o.textContent=c.name;s.appendChild(o)});s.value=state.classId;let c=currentClass();$('#classInfo').textContent='가입 코드: '+c.code+' · '+classmates.length+'명';$('#studentList').innerHTML='';classmates.forEach((n,i)=>{let e=document.createElement('div');e.className='studentrow';e.innerHTML=`<div class="row"><input type="checkbox" class="pick"><div class="grow"><b>${n}</b><div class="muted">연구원 Lv.${i+3} · 🎫 ${i%3}</div></div></div><div class="reward"><button class="btn small">🎫 +1</button><button class="btn alt small">XP +10</button></div>`;e.querySelectorAll('button').forEach(b=>b.onclick=()=>note(n+' · '+b.textContent+' 지급'));$('#studentList').appendChild(e)})}
$('#classSelect').onchange=e=>{state.classId=+e.target.value;save();render()};$('#newClassBtn').onclick=()=>{$('#classNameInput').value='';$('#classCodeInput').value='';$('#classModal').classList.add('on')};$('#closeClass').onclick=()=>$('#classModal').classList.remove('on');$('#saveClass').onclick=()=>{let name=$('#classNameInput').value.trim(),code=$('#classCodeInput').value.trim().toUpperCase();if(!name||!code)return note('반 이름과 가입 코드를 입력해 주세요.');if(state.classes.some(c=>c.code.toUpperCase()===code))return note('이미 사용 중인 코드예요.');let id=Date.now();state.classes.push({id,name,code});state.classId=id;save();$('#classModal').classList.remove('on');render();note('새 반을 만들었어요!')};
$('#allTicket').onclick=()=>note('선택 학생에게 뽑기권 +1');$('#allXp').onclick=()=>note('선택 학생에게 XP +10');render();
</script></body></html>
