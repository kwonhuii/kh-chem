<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KH CHEM</title>
<style>
:root{--bg:#f7fafc;--card:#fff;--ink:#263246;--muted:#8390a2;--line:#e7edf3;--blue:#8fc8e8;--soft:#eaf6fc;--deep:#4d91bb}
*{box-sizing:border-box}html,body{margin:0;max-width:100%;overflow-x:hidden}body{background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink)}
button,input,select{font:inherit}.app{width:100%;max-width:760px;margin:0 auto;padding:18px 16px 96px}.header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.brand{font-size:23px;font-weight:900;letter-spacing:-1px}.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:.5px}.card{width:100%;background:#fff;border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 5px 18px #4561a00a}.hero{text-align:center}.label,.muted{color:var(--muted);font-size:13px}
.mascot{width:104px;height:104px;margin:8px auto;display:flex;align-items:center;justify-content:center;border-radius:50%;background:linear-gradient(145deg,#f7fcff,#e5f5fd);font-size:48px}
.name{font-size:22px;font-weight:900}.bar{height:9px;max-width:270px;margin:9px auto 5px;border-radius:20px;background:#edf1f5;overflow:hidden}.bar i{display:block;width:25%;height:100%;background:var(--blue)}
.chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:13px 0}.chip{padding:7px 11px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}.stat{min-width:0;padding:11px 5px;border-radius:15px;background:#f5f8fa;text-align:center}.stat b{display:block;white-space:normal;overflow-wrap:anywhere}
.btn{border:0;border-radius:14px;min-height:42px;padding:9px 13px;background:var(--deep);color:#fff;font-weight:800}.btn.alt{background:var(--soft);color:#3d7698}.btn.ghost{background:#f2f5f7;color:#566577}.btn.small{min-height:35px;padding:7px 10px;font-size:12px}.row{display:flex;gap:9px;align-items:center}.grow{flex:1;min-width:0}.input{width:100%;min-width:0;border:1px solid var(--line);border-radius:14px;padding:11px;background:#fff}.title{font-weight:900;margin-bottom:10px}.page{display:none}.page.on{display:block}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.mon{border:1px solid var(--line);border-radius:18px;padding:13px;text-align:center;background:#fff}.mon .pic{font-size:38px}.studentrow{padding:12px 0;border-top:1px solid var(--line)}.studentrow:first-child{border-top:0}
.tabs{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding:7px}.tab{border:0;background:none;border-radius:13px;min-height:57px;color:var(--muted)}.tab.on{background:var(--soft);color:#3d7698;font-weight:800}.tab span{display:block;font-size:20px}
.teacher{display:none}.modal{display:none;position:fixed;inset:0;z-index:30;background:#17202b55;align-items:center;justify-content:center;padding:18px}.modal.on{display:flex}.modalbox{width:min(430px,100%);background:#fff;border-radius:24px;padding:20px}.notice{display:none;position:fixed;z-index:40;top:15px;left:50%;transform:translateX(-50%);background:#263246;color:#fff;padding:9px 14px;border-radius:999px;font-size:13px}
@media(min-width:600px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

.oxygenmon{position:relative;font-size:0;background:radial-gradient(circle at 35% 28%,#fff 0 8%,#dff5ff 30%,#9edcf6 72%,#72c4e8 100%);border:4px solid #fff;box-shadow:0 8px 20px #7fc8e83b,inset -8px -10px 18px #5bb5dd30}
.oxygenmon:before,.oxygenmon:after{content:"";position:absolute;width:31px;height:22px;top:10px;border:5px solid #c6def1;border-bottom-width:3px;background:#ffffff70}
.oxygenmon:before{left:17px;border-radius:18px 12px 15px 10px;transform:rotate(-7deg)}.oxygenmon:after{right:17px;border-radius:12px 18px 10px 15px;transform:rotate(7deg)}
.o-eye{position:absolute;top:48px;width:8px;height:11px;background:#263246;border-radius:50%}.o-eye.left{left:32px}.o-eye.right{right:32px}
.o-mouth{position:absolute;left:47px;top:64px;width:12px;height:7px;border-radius:0 0 12px 12px;background:#ef7380}
.o-cheek{position:absolute;top:61px;width:12px;height:6px;border-radius:50%;background:#f7a9b4aa}.o-cheek.left{left:18px}.o-cheek.right{right:18px}
.o-bubble{position:absolute;border-radius:50%;background:#c9efff;border:2px solid #fff;box-shadow:0 2px 5px #73c8eb55}.b1{width:15px;height:15px;right:-7px;top:20px}.b2{width:10px;height:10px;left:-4px;top:34px}
.o2{position:absolute;right:4px;bottom:4px;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#62bde8;color:white;font-size:14px;font-weight:900;border:3px solid #fff;box-shadow:0 3px 8px #5aaed45c}
</style></head>
<body><div id="notice" class="notice"></div><div class="app">
<header class="header"><div class="brand">KH CHEM<small>Chemistry Class</small></div><button id="teacherBtn" class="btn alt small">교사 모드</button></header>
<main id="student">
<section id="home" class="page on"><div class="card hero">
<div class="label">대표 케미몬</div><div id="heroPic" class="mascot oxygenmon" aria-label="산소몬">
      <span class="o-eye left"></span><span class="o-eye right"></span>
      <span class="o-mouth"></span><span class="o-cheek left"></span><span class="o-cheek right"></span>
      <span class="o-bubble b1"></span><span class="o-bubble b2"></span>
      <span class="o2">O₂</span>
    </div><div id="heroName" class="name">산소몬</div><div id="heroMeta" class="muted">O · Lv.2</div><div class="bar"><i id="growth"></i></div><div id="growthText" class="muted">성장 1 / 4</div>
<div class="chips"><span class="chip">🧑‍🔬 <span id="nickname">새싹연구원</span></span><span class="chip">🎫 <span id="tickets">3</span></span></div>
<div class="stats"><div class="stat"><span class="muted">연구원</span><b>Lv.8</b></div><div class="stat"><span class="muted">도감</span><b><span id="found">4</span>/12</b></div><div class="stat"><span class="muted">소속 반</span><b id="classShort">화학Ⅰ 1반</b></div></div>
<button id="editProfile" class="btn ghost small" style="margin-top:12px">닉네임 · 반 설정</button></div>
<div class="card"><div class="title">오늘의 활동</div><div class="row"><div style="font-size:27px">⚗️</div><div class="grow"><b>화학 반응에서의 양적 관계</b><div class="muted">활동을 완료하고 보상을 받아보세요.</div></div></div></div></section>
<section id="draw" class="page"><div class="card hero"><div class="title">케미몬 뽑기</div><div id="drawPic" class="mascot">🎁</div><div id="drawMsg" class="name">누구를 만나게 될까?</div><p class="muted">새 케미몬은 도감에 등록되고, 중복은 성장해요.</p><button id="drawBtn" class="btn">🎫 1장 사용</button></div></section>
<section id="dex" class="page"><div class="title">케미몬 도감</div><div id="dexGrid" class="grid"></div></section>
<section id="classroom" class="page"><div class="card"><div class="title" id="classTitle">화학Ⅰ 1반</div><div class="muted">친구들의 대표 케미몬</div><div id="friends"></div></div></section>
</main>
<main id="teacher" class="teacher"><div class="card"><div class="row"><div class="grow"><div class="title">교사 관리</div><div class="muted">반 개설 · 학생 · 보상 관리</div></div><button id="studentBtn" class="btn alt small">학생 화면</button></div></div>
<div class="card"><div class="row"><select id="classSelect" class="input grow"></select><button id="newClassBtn" class="btn small">+ 새 반</button></div><div id="classInfo" class="muted" style="margin-top:8px"></div></div>
<div class="card"><div class="title">학생 관리</div><div class="row" style="margin-bottom:10px"><button id="allTicket" class="btn small">선택 🎫 +1</button><button id="allXp" class="btn alt small">선택 XP +10</button></div><div id="studentList"></div></div></main></div>
<nav id="tabs" class="tabs"><button class="tab on" data-p="home"><span>🏠</span>홈</button><button class="tab" data-p="draw"><span>🎁</span>케미몬</button><button class="tab" data-p="dex"><span>📖</span>도감</button><button class="tab" data-p="classroom"><span>👥</span>우리 반</button></nav>
<div id="profileModal" class="modal"><div class="modalbox"><div class="title">내 정보 설정</div><div class="muted">닉네임</div><input id="nicknameInput" class="input" maxlength="12"><div style="height:10px"></div><div class="muted">반 가입 코드</div><input id="codeInput" class="input" maxlength="8" placeholder="예: CHEM1"><div class="row" style="margin-top:14px"><button id="closeProfile" class="btn ghost grow">취소</button><button id="saveProfile" class="btn grow">저장</button></div></div></div>
<div id="classModal" class="modal"><div class="modalbox"><div class="title">새 반 만들기</div><input id="classNameInput" class="input" placeholder="예: 화학Ⅰ 2반"><div style="height:10px"></div><input id="classCodeInput" class="input" placeholder="가입 코드 예: CHEM2" maxlength="8"><div class="row" style="margin-top:14px"><button id="closeClass" class="btn ghost grow">취소</button><button id="saveClass" class="btn grow">반 만들기</button></div></div></div>
<script>
const mons=[['H','수소몬','☁️'],['He','헬륨몬','🎈'],['C','탄소몬','💎'],['N','질소몬','🌫️'],['O','산소몬','🫧'],['Ne','네온몬','✨'],['Na','나트륨몬','🧂'],['Mg','마그네슘몬','🌟'],['Cl','염소몬','🟢'],['Fe','철몬','⚙️'],['Cu','구리몬','🟠'],['Au','골드몬','👑']].map(x=>({id:x[0],name:x[1],pic:x[2]}));
let state=JSON.parse(localStorage.getItem('khchem-clean')||'null')||{nickname:'새싹연구원',tickets:3,hero:'O',classId:1,owned:{H:{lv:1,c:0},C:{lv:1,c:0},O:{lv:2,c:1},Ne:{lv:1,c:0}},classes:[{id:1,name:'화학Ⅰ 1반',code:'CHEM1'},{id:2,name:'화학Ⅰ 2반',code:'CHEM2'}]};
const mates=['민트','구름','몰리','코코','나나'];const $=s=>document.querySelector(s),get=id=>mons.find(m=>m.id===id),save=()=>localStorage.setItem('khchem-clean',JSON.stringify(state));function cl(){return state.classes.find(x=>x.id==state.classId)||state.classes[0]}function note(t){let n=$('#notice');n.textContent=t;n.style.display='block';setTimeout(()=>n.style.display='none',1500)}
function render(){let h=get(state.hero),d=state.owned[state.hero],need=Math.min(d.lv+2,6),c=cl();if(h.id==='O'){if(!$('#heroPic').classList.contains('oxygenmon'))location.reload()}else{$('#heroPic').classList.remove('oxygenmon');$('#heroPic').textContent=h.pic}$('#heroName').textContent=h.name;$('#heroMeta').textContent=h.id+' · Lv.'+d.lv;$('#growth').style.width=(d.c/need*100)+'%';$('#growthText').textContent='성장 '+d.c+' / '+need;$('#nickname').textContent=state.nickname;$('#tickets').textContent=state.tickets;$('#found').textContent=Object.keys(state.owned).length;$('#classShort').textContent=c.name;$('#classTitle').textContent=c.name;
$('#dexGrid').innerHTML='';mons.forEach(m=>{let d=state.owned[m.id],e=document.createElement('div');e.className='mon';e.innerHTML=d?`<div class="pic">${m.pic}</div><b>${m.name}</b><div class="muted">${m.id} · Lv.${d.lv}</div><button class="btn alt small" style="margin-top:7px">${state.hero===m.id?'대표':'대표 설정'}</button>`:`<div class="pic">❔</div><b>미발견</b><div class="muted">${m.id}</div>`;if(d)e.querySelector('button').onclick=()=>{state.hero=m.id;save();render()};$('#dexGrid').appendChild(e)});
$('#friends').innerHTML='';mates.forEach((n,i)=>{let m=mons[(i*2+4)%mons.length],e=document.createElement('div');e.className='studentrow row';e.innerHTML=`<div style="font-size:32px">${m.pic}</div><div class="grow"><b>${n}</b><div class="muted">${m.name} · Lv.${i+1}</div></div>`;$('#friends').appendChild(e)});teacherRender()}
$('#drawBtn').onclick=()=>{if(state.tickets<1)return note('뽑기권이 없어요.');state.tickets--;let m=mons[Math.floor(Math.random()*mons.length)];$('#drawPic').textContent=m.pic;if(!state.owned[m.id]){state.owned[m.id]={lv:1,c:0};$('#drawMsg').textContent='NEW! '+m.name}else{let d=state.owned[m.id];d.c++;let need=Math.min(d.lv+2,6);if(d.c>=need){d.lv++;d.c=0;$('#drawMsg').textContent=m.name+' Lv.'+d.lv+'!'}else $('#drawMsg').textContent=m.name+' 성장 +1'}save();render()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));$('#'+b.dataset.p).classList.add('on')});
$('#editProfile').onclick=()=>{$('#nicknameInput').value=state.nickname;$('#codeInput').value='';$('#profileModal').classList.add('on')};$('#closeProfile').onclick=()=>$('#profileModal').classList.remove('on');$('#saveProfile').onclick=()=>{let n=$('#nicknameInput').value.trim(),code=$('#codeInput').value.trim().toUpperCase();if(n)state.nickname=n;if(code){let c=state.classes.find(x=>x.code.toUpperCase()===code);if(!c)return note('가입 코드를 확인해 주세요.');state.classId=c.id}save();$('#profileModal').classList.remove('on');render();note('저장했어요!')};
$('#teacherBtn').onclick=()=>{$('#student').style.display='none';$('#teacher').style.display='block';$('#tabs').style.display='none'};$('#studentBtn').onclick=()=>{$('#student').style.display='block';$('#teacher').style.display='none';$('#tabs').style.display='grid'};
function teacherRender(){let s=$('#classSelect');s.innerHTML='';state.classes.forEach(c=>{let o=document.createElement('option');o.value=c.id;o.textContent=c.name;s.appendChild(o)});s.value=state.classId;$('#classInfo').textContent='가입 코드: '+cl().code;$('#studentList').innerHTML='';mates.forEach((n,i)=>{let e=document.createElement('div');e.className='studentrow';e.innerHTML=`<div class="row"><input type="checkbox" class="pick"><div class="grow"><b>${n}</b><div class="muted">연구원 Lv.${i+3} · 🎫 ${i%3}</div></div></div>`;$('#studentList').appendChild(e)})}
$('#classSelect').onchange=e=>{state.classId=+e.target.value;save();render()};$('#newClassBtn').onclick=()=>$('#classModal').classList.add('on');$('#closeClass').onclick=()=>$('#classModal').classList.remove('on');$('#saveClass').onclick=()=>{let n=$('#classNameInput').value.trim(),code=$('#classCodeInput').value.trim().toUpperCase();if(!n||!code)return note('반 이름과 코드를 입력해 주세요.');if(state.classes.some(x=>x.code.toUpperCase()===code))return note('이미 사용 중인 코드예요.');let id=Date.now();state.classes.push({id,name:n,code});state.classId=id;save();$('#classModal').classList.remove('on');render();note('새 반을 만들었어요!')};$('#allTicket').onclick=()=>note('선택 학생에게 🎫 +1');$('#allXp').onclick=()=>note('선택 학생에게 XP +10');render();
</script></body></html>
